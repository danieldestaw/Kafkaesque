apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kafkaesque.fullname" . }}-secrets
  labels:
    {{- include "kafkaesque.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ required "secrets.jwtSecret is required in production" .Values.secrets.jwtSecret | quote }}
  encryption-key: {{ required "secrets.encryptionKey is required in production" .Values.secrets.encryptionKey | quote }}
