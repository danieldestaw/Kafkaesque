apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kafkaesque.fullname" . }}-backend
  labels:
    {{- include "kafkaesque.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kafkaesque.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "kafkaesque.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: backend
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: APP_ENV
              value: {{ .Values.env.APP_ENV | quote }}
            - name: HTTP_PORT
              value: {{ .Values.env.HTTP_PORT | quote }}
            - name: DATABASE_URL
              value: {{ printf "postgres://%s:%s@%s-postgresql:5432/%s?sslmode=disable" .Values.postgresql.auth.username .Values.postgresql.auth.password (include "kafkaesque.fullname" .) .Values.postgresql.auth.database | quote }}
            - name: CORS_ORIGINS
              value: {{ .Values.env.CORS_ORIGINS | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "kafkaesque.fullname" . }}-secrets
                  key: jwt-secret
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "kafkaesque.fullname" . }}-secrets
                  key: encryption-key
            - name: OIDC_ENABLED
              value: {{ .Values.env.OIDC_ENABLED | quote }}
            - name: LOCAL_LOGIN_ENABLED
              value: {{ .Values.env.LOCAL_LOGIN_ENABLED | quote }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kafkaesque.fullname" . }}-backend
  labels:
    {{- include "kafkaesque.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8090
      targetPort: http
      name: http
  selector:
    {{- include "kafkaesque.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
