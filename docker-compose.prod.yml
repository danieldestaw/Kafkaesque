# Production overlay for Kafkaesque.
# Usage:
#   cp .env.production.example .env
#   # edit .env with strong secrets and your public URL
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Optional TLS at nginx (instead of an external load balancer):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.prod.tls.yml up -d --build

services:
  kafkaesque-db:
    ports: []
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    ports: []
    restart: unless-stopped
    environment:
      APP_ENV: production
      HTTP_PORT: "8090"
      DATABASE_URL: postgres://${POSTGRES_USER:-kafkaesque}:${POSTGRES_PASSWORD}@kafkaesque-db:5432/${POSTGRES_DB:-kafkaesque}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}
      DEFAULT_ADMIN_USER: ${DEFAULT_ADMIN_USER:-admin}
      DEFAULT_ADMIN_PASS: ${DEFAULT_ADMIN_PASS:?set DEFAULT_ADMIN_PASS in .env}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8090/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    restart: unless-stopped
    ports:
      - "${KAFKAESQUE_HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
