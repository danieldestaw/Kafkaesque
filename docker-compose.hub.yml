# Run Kafkaesque from pre-built images on Docker Hub (no local build).
#
# Quick start (development defaults — change secrets for production):
#   docker compose -f docker-compose.hub.yml up -d
#
# Production (secrets required — see .env.production.example):
#   cp .env.production.example .env
#   ./scripts/generate-secrets.sh
#   docker compose -f docker-compose.hub.yml -f docker-compose.prod.yml --env-file .env up -d
#
# Pin a version:
#   KAFKAESQUE_IMAGE_TAG=1.0.0 docker compose -f docker-compose.hub.yml up -d
#
# Override image namespace (forks / private registry mirror):
#   DOCKERHUB_USER=youruser docker compose -f docker-compose.hub.yml up -d

services:
  kafkaesque-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kafkaesque
      POSTGRES_USER: kafkaesque
      POSTGRES_PASSWORD: kafkaesque
    ports:
      - "5433:5432"
    volumes:
      - kafkaesque_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kafkaesque -d kafkaesque"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - kafkaesque-net

  backend:
    image: ${DOCKERHUB_USER:-kafkaesqueapp}/kafkaesque-backend:${KAFKAESQUE_IMAGE_TAG:-latest}
    ports:
      - "8090:8090"
    environment:
      APP_ENV: development
      HTTP_PORT: "8090"
      DATABASE_URL: postgres://kafkaesque:kafkaesque@kafkaesque-db:5432/kafkaesque?sslmode=disable
      JWT_SECRET: dev-kafkaesque-secret-change-in-prod
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef"
      CORS_ORIGINS: http://localhost:3100
      DEFAULT_ADMIN_USER: admin
      DEFAULT_ADMIN_PASS: admin
    depends_on:
      kafkaesque-db:
        condition: service_healthy
    networks:
      - kafkaesque-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    image: ${DOCKERHUB_USER:-kafkaesqueapp}/kafkaesque-frontend:${KAFKAESQUE_IMAGE_TAG:-latest}
    ports:
      - "3100:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - kafkaesque-net

networks:
  kafkaesque-net:
    driver: bridge

volumes:
  kafkaesque_postgres:
